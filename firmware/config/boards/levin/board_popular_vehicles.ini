; Levin: content of Controller -> Base Tunes (engineTypeDialog).
; Resets the whole ECU configuration to the Levin board default base tune
; (DEFAULT_ENGINE_TYPE + levinDefaultConfiguration). TunerStudio has no
; confirmation popup for commandButton, so the button is gated by a PC variable.
		field = ""
		field = "!WARNING: this resets ALL settings stored in the ECU to the Levin default base tune."
		field = "!Pins, sensors, fuel, ignition, idle and every table will be lost. This cannot be undone."
		field = "!Save your current tune to a file (File -> Save Tune As) before continuing."
		field = ""
		field = "I understand that all my settings will be erased", levinResetConfirm
		commandButton = "Reset ECU to Levin default base tune", cmd_set_engine_type_default, { levinResetConfirm == 1 }
